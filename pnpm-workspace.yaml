# Controls which dependency postinstall build scripts pnpm may run.
# esbuild → downloads its native binary (used by Vite).
# vue-demi → sets the correct Vue 3 bindings (used by Pinia).
# core-js → only prints a donation notice; not needed.
# ffmpeg-static / ffprobe-static → download the ffmpeg/ffprobe binaries (video thumbnails server).
# sharp → installs its native libvips binary (photo cropping server).
allowBuilds:
  esbuild: true
  vue-demi: true
  core-js: false
  ffmpeg-static: true
  ffprobe-static: true
  sharp: true
